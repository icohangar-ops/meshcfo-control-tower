[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcfo-control-tower"
version = "0.1.0"
description = "Cubiczan MeshCFO Control Tower — governed ICFR remediation briefs from SEC EDGAR material-weakness and restatement signals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Cubiczan", email = "sam@cubiczan.com" }]
keywords = [
    "meshcfo",
    "cubiczan",
    "icfr",
    "sec-edgar",
    "nemotron",
    "nebius",
    "cfo",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
meshcfo-brief = "meshcfo_control_tower.cli:main"

[project.urls]
Homepage = "https://github.com/Cubiczan/meshcfo-control-tower"
MeshCFO = "https://github.com/Cubiczan/meshcfo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meshcfo_control_tower = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
